    /* ── NAV ── */
    nav{padding:28px 32px 0;}
    .nav-inner{max-width:1200px;margin:0 auto}
    .back-link{font-size:16px;font-weight:600;color:var(--gray-900);text-decoration:none}
    .back-link .accent{color:var(--green-600)}
    .back-link:hover .accent{color:var(--green-700)}

    /* ── HERO ── */
    .gallery-hero{max-width:1200px;margin:0 auto;padding:80px 32px 40px}
    .gallery-hero h1{
      font-family:var(--f-heading);font-weight:700;
      font-size:56px;line-height:1.15;color:var(--gray-900);
      max-width:900px;
    }
    .gallery-hero h1 .accent{color:var(--green-600)}
    .gallery-hero p{font-family:var(--f-body);font-size:17px;color:var(--gray-600);max-width:560px;margin-top:20px}

    /* ── GRID ── */
    .gallery-grid{
      max-width:1200px;margin:0 auto;padding:16px 32px 80px;
      display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:32px;
    }
    .gallery-card{
      background:#fff;border-radius:10px;overflow:hidden;cursor:pointer;
      box-shadow:0 1px 3px rgba(0,0,0,.08);
      transition:transform .2s ease, box-shadow .2s ease;
    }
    .gallery-card:hover{transform:translateY(-4px);box-shadow:0 14px 28px rgba(0,0,0,.12)}
    .gallery-card-img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block;background:#eee}
    .gallery-card-body{padding:18px 20px 22px}
    .gallery-card-body h3{font-family:var(--f-heading);font-weight:700;font-size:19px;color:var(--gray-900);margin-bottom:4px}
    .gallery-card-body p{font-family:var(--f-body);font-size:13px;color:var(--gray-500)}

    /* ── LIGHTBOX ── */
    .lightbox{
      display:none;position:fixed;inset:0;z-index:1000;
      background:rgba(17,24,39,.94);
      align-items:center;justify-content:center;padding:40px;
    }
    .lightbox.open{display:flex}
    .lightbox img{
      max-width:100%;max-height:90vh;width:auto;height:auto;
      object-fit:contain;border-radius:4px;box-shadow:0 20px 60px rgba(0,0,0,.5);
    }
    .lightbox-close{
      position:fixed;top:20px;right:28px;color:#fff;font-size:36px;
      background:none;border:none;cursor:pointer;line-height:1;z-index:1001;
    }

    footer{text-align:center;padding:40px 32px;font-family:var(--f-body);font-size:13px;color:var(--gray-500)}

    @media(max-width:640px){
      .gallery-hero h1{font-size:36px}
    }
  </style>
</head>
<body>

<!-- NAV -->
<nav>
  <div class="nav-inner">
    <a href="/#projects" class="back-link">&larr; Back to <span class="accent">Blog</span></a>
  </div>
</nav>

<!-- HERO -->
<section class="gallery-hero">
  <h1>Maps, Illustrations and <span class="accent">Infographics</span></h1>
  <p>A collection of maps, illustartions and Infrographics from my work.</p>
</section>

<!-- GRID -->
<div class="gallery-grid" id="galleryGrid">

  <div class="gallery-card" data-full="african-savanna-elephant-range-map.jpg" data-title="African Savanna Elephant Range Map">
    <img class="gallery-card-img" src="african-savanna-elephant-range-map.jpg" alt="African Savanna Elephant Range Map" loading="lazy" />
    <div class="gallery-card-body">
      <h3>African Savanna Elephant Range Map</h3>
      <p> Elephant ranging and conservation status across sub-Saharan Africa</p>
    </div>
  </div>

  <!-- Add more items by copying the block above: update data-full, the img src, the h3, and the p caption -->

</div>

<footer>Festus Bett &copy; 2026</footer>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightboxClose" aria-label="Close">&times;</button>
  <img id="lightboxImg" src="" alt="" />
</div>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    var cards = document.querySelectorAll('.gallery-card');
    var lightbox = document.getElementById('lightbox');
    var lightboxImg = document.getElementById('lightboxImg');
    var lightboxClose = document.getElementById('lightboxClose');

    function openLightbox(card) {
      var full = card.getAttribute('data-full');
      var title = card.getAttribute('data-title') || '';
      lightboxImg.src = full;
      lightboxImg.alt = title;
      lightbox.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      lightbox.classList.remove('open');
      lightboxImg.src = '';
      document.body.style.overflow = '';
    }

    cards.forEach(function (card) {
      card.addEventListener('click', function () { openLightbox(card); });
      card.setAttribute('tabindex', '0');
      card.setAttribute('role', 'button');
      card.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openLightbox(card); }
      });
    });

    lightboxClose.addEventListener('click', closeLightbox);
    lightbox.addEventListener('click', function (e) {
      if (e.target === lightbox) closeLightbox();
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') closeLightbox();
    });
  });
</script>

</body>
</html>
